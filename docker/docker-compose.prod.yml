# Production overlay for mitomap-link (Container & Deployment Hardening Standard v1).
#
#   MITOMAP_LINK_IMAGE=ghcr.io/berntpopp/mitomap-link@sha256:<digest> \
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d

services:
  mitomap-data-init:
    build: !reset null
    image: ${MITOMAP_LINK_IMAGE:?Set MITOMAP_LINK_IMAGE to ghcr.io/berntpopp/mitomap-link@sha256:<digest>}
    pull_policy: missing
    volumes: !override
      - mitomap-reference:/data
    networks: !override
      - default

  mitomap-link:
    build: !reset null
    image: ${MITOMAP_LINK_IMAGE:?Set MITOMAP_LINK_IMAGE to ghcr.io/berntpopp/mitomap-link@sha256:<digest>}
    pull_policy: missing
    container_name: !reset null
    env_file: !reset []
    ports: !reset []
    expose:
      - "8000"
    environment:
      GF_HEALTHCHECK_HOST: localhost
      MITOMAP_LINK_HOST: 0.0.0.0
      MITOMAP_LINK_PORT: 8000
      MITOMAP_LINK_TRANSPORT: unified
      MITOMAP_LINK_MCP_PATH: /mcp
      MITOMAP_LINK_LOG_LEVEL: INFO
      MITOMAP_LINK_LOG_FORMAT: json
      MITOMAP_LINK_ALLOWED_HOSTS: '["localhost","127.0.0.1","::1","mitomap-link.genefoundry.org"]'
      MITOMAP_LINK_DATA__REFERENCE_ROOT: /data
    volumes: !override
      - mitomap-reference:/data:ro
    read_only: true
    tmpfs: !override
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt: !override
      - no-new-privileges:true
    cap_drop: !override
      - ALL
    init: true
    restart: unless-stopped
    mem_limit: !reset null
    cpus: !reset null
    pids_limit: !reset null
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
          pids: 256
    healthcheck: !override
      test: ["CMD", "sh", "-c", "curl -f -H \"Host: $${GF_HEALTHCHECK_HOST}\" http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=mitomap-link,environment=production"
    networks: !override
      - default

volumes: !override
  mitomap-reference:
    name: mitomap-link_mitomap-reference

networks: !override
  default:
    name: mitomap-link_default
